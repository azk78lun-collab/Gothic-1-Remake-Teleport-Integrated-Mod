server {
    listen 80;
    listen [::]:80;
    server_name gothic.1223344.xyz;

    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gothic.1223344.xyz;

    ssl_certificate /etc/nginx/ssl/1223344.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/1223344.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log off;
    error_log /var/log/nginx/g1r-community.error.log;

    location / {
        proxy_pass http://127.0.0.1:18182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 16k;
    }
}
